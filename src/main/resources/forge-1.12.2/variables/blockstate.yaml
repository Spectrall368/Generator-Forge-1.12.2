defaultvalue: Blocks.AIR.getDefaultState()
scopes:
  local:
    init: ${var.getType().getJavaType(generator.getWorkspace())} ${var.getName()} = ${var.getType().getDefaultValue(generator.getWorkspace())};
    get: /*@BlockState*/${name}
    set: <#include "mcitems.ftl"> ${name} = ${mappedBlockToBlockStateCode(value)};
  global_session:
    init: public static IBlockState ${var.getName()} = ${generator.map(var.getValue(), "blocksitems")}.getDefaultState();
    get: /*@BlockState*/${JavaModName}Variables.${name}
    set: <#include "mcitems.ftl"> ${JavaModName}Variables.${name} = ${mappedBlockToBlockStateCode(value)};
  global_world:
    init: public IBlockState ${var.getName()} = ${generator.map(var.getValue(), "blocksitems")}.getDefaultState();
    read: ${var.getName()} = NBTUtil.readBlockState(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", NBTUtil.writeBlockState(new NBTTagCompound(), ${var.getName()}));
    get: /*@BlockState*/${JavaModName}Variables.WorldVariables.get(world).${name}
    set: |
      <#include "mcitems.ftl">
      ${JavaModName}Variables.WorldVariables.get(world).${name} = ${mappedBlockToBlockStateCode(value)};
      <@tail>${JavaModName}Variables.WorldVariables.get(world).markSyncDirty();</@tail>
  global_map:
    init: public IBlockState ${var.getName()} = ${generator.map(var.getValue(), "blocksitems")}.getDefaultState();
    read: ${var.getName()} = NBTUtil.readBlockState(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", NBTUtil.writeBlockState(new NBTTagCompound(), ${var.getName()}));
    get: /*@BlockState*/${JavaModName}Variables.MapVariables.get(world).${name}
    set: |
      <#include "mcitems.ftl">
      ${JavaModName}Variables.MapVariables.get(world).${name} = ${mappedBlockToBlockStateCode(value)};
      <@tail>${JavaModName}Variables.MapVariables.get(world).markSyncDirty();</@tail>
  player_lifetime:
    init: public IBlockState ${var.getName()} = ${generator.map(var.getValue(), "blocksitems")}.getDefaultState();
    read: ${var.getName()} = NBTUtil.readBlockState(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", NBTUtil.writeBlockState(new NBTTagCompound(), ${var.getName()}));
    get: "/*@BlockState*/(${entity}.hasCapability(${JavaModName}Variables.PLAYER_VARIABLES, null) ? ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null).${name} : new ${JavaModName}Variables.PlayerVariables().${name})"
    set: |
      <#include "mcitems.ftl">
      <@head>{${JavaModName}Variables.PlayerVariables _playerVars = ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null);
        if (_playerVars != null) {</@head>
            _playerVars.${name} = ${mappedBlockToBlockStateCode(value)};
            <@tail>_playerVars.markSyncDirty();
        }
      }</@tail>
  player_persistent:
    init: public IBlockState ${var.getName()} = ${generator.map(var.getValue(), "blocksitems")}.getDefaultState();
    read: ${var.getName()} = NBTUtil.readBlockState(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", NBTUtil.writeBlockState(new NBTTagCompound(), ${var.getName()}));
    get: "/*@BlockState*/(${entity}.hasCapability(${JavaModName}Variables.PLAYER_VARIABLES, null) ? ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null).${name} : new ${JavaModName}Variables.PlayerVariables().${name})"
    set: |
      <#include "mcitems.ftl">
      <@head>{${JavaModName}Variables.PlayerVariables _playerVars = ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null);
        if (_playerVars != null) {</@head>
            _playerVars.${name} = ${mappedBlockToBlockStateCode(value)};
            <@tail>_playerVars.markSyncDirty();
        }
      }</@tail>