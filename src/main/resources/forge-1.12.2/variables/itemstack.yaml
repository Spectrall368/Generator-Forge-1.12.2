defaultvalue: ItemStack.EMPTY
scopes:
  local:
    init: ${var.getType().getJavaType(generator.getWorkspace())} ${var.getName()} = ${var.getType().getDefaultValue(generator.getWorkspace())};
    get: /*@ItemStack*/${name}
    set: <#include "mcitems.ftl"> ${name} = ${mappedMCItemToItemStackCode(value, 1)}.copy();
  global_session:
    init: public static ItemStack ${var.getName()} = ItemStack.EMPTY;
    get: /*@ItemStack*/${JavaModName}Variables.${name}
    set: <#include "mcitems.ftl"> ${JavaModName}Variables.${name} = ${mappedMCItemToItemStackCode(value, 1)}.copy();
  global_world:
    init: public ItemStack ${var.getName()} = ItemStack.EMPTY;
    read: ${var.getName()} = new ItemStack(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", ${var.getName()}.writeToNBT(new NBTTagCompound()));
    get: /*@ItemStack*/${JavaModName}Variables.WorldVariables.get(world).${name}
    set: |
      <#include "mcitems.ftl">
      ${JavaModName}Variables.WorldVariables.get(world).${name} = ${mappedMCItemToItemStackCode(value, 1)}.copy();
      <@tail>${JavaModName}Variables.WorldVariables.get(world).markSyncDirty();</@tail>
  global_map:
    init: public ItemStack ${var.getName()} = ItemStack.EMPTY;
    read: ${var.getName()} = new ItemStack(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", ${var.getName()}.writeToNBT(new NBTTagCompound()));
    get: /*@ItemStack*/${JavaModName}Variables.MapVariables.get(world).${name}
    set: |
      <#include "mcitems.ftl">
      ${JavaModName}Variables.MapVariables.get(world).${name} = ${mappedMCItemToItemStackCode(value, 1)}.copy();
      <@tail>${JavaModName}Variables.MapVariables.get(world).markSyncDirty();</@tail>
  player_lifetime:
    init: public ItemStack ${var.getName()} = ItemStack.EMPTY;
    read: ${var.getName()} = new ItemStack(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", ${var.getName()}.writeToNBT(new NBTTagCompound()));
    get: "/*@ItemStack*/(${entity}.hasCapability(${JavaModName}Variables.PLAYER_VARIABLES, null) ? ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null).${name} : new ${JavaModName}Variables.PlayerVariables().${name})"
    set: |
      <#include "mcitems.ftl">
      <@head>{${JavaModName}Variables.PlayerVariables _playerVars = ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null);
        if (_playerVars != null) {</@head>
            _playerVars.${name} = ${mappedMCItemToItemStackCode(value, 1)}.copy();
            <@tail>_playerVars.markSyncDirty();
        }
      }</@tail>
  player_persistent:
    init: public ItemStack ${var.getName()} = ItemStack.EMPTY;
    read: ${var.getName()} = new ItemStack(nbt.getCompoundTag("${var.getName()}"));
    write: nbt.setTag("${var.getName()}", ${var.getName()}.writeToNBT(new NBTTagCompound()));
    get: "/*@ItemStack*/(${entity}.hasCapability(${JavaModName}Variables.PLAYER_VARIABLES, null) ? ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null).${name} : new ${JavaModName}Variables.PlayerVariables().${name})"
    set: |
      <#include "mcitems.ftl">
      <@head>{${JavaModName}Variables.PlayerVariables _playerVars = ${entity}.getCapability(${JavaModName}Variables.PLAYER_VARIABLES, null);
        if (_playerVars != null) {</@head>
            _playerVars.${name} = ${mappedMCItemToItemStackCode(value, 1)}.copy();
            <@tail>_playerVars.markSyncDirty();
        }
      }</@tail>