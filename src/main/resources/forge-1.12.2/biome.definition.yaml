templates:
  - template: biome/biome.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/world/biome/@NAMEBiome.java"
  - template: biome/tree_trunk_decorator.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/world/features/treedecorators/@NAMETreeFeature.java"
    condition_any:
      - hasVines()
      - hasFruits()

global_templates:
  - template: elementinits/biomes.java.ftl
    writer: java
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameBiomes.java"

localizationkeys:
  - key: biome.@modid.@registryname
    mapto: name

field_exclusions: [spawnNetherBridge, spawnEndCity, spawnMineshaft, spawnMineshaftMesa, oceanRuinType, spawnBuriedTreasure, spawnShipwreckBeached, spawnShipwreck, spawnPillagerOutpost, underwaterBlock, waterFogColor, spawnInCaves, spawnBiomeNether, spawnNetherFossil, spawnBastionRemnant, spawnRuinedPortal, ambientSound, moodSound, moodSoundDelay, additionsSound, music, spawnParticle, particleToSpawn, particlesProbability, fogColor]
